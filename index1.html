<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>選擇困難抑制器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101e;
      --panel: rgba(14, 27, 47, .74);
      --panel-strong: #101f35;
      --line: rgba(166, 199, 255, .14);
      --text: #f3f7ff;
      --muted: #92a4bf;
      --accent: #68e8d5;
      --accent-2: #7b8cff;
      --danger: #ff7692;
      --radius: 24px;
      --shadow: 0 28px 80px rgba(0, 0, 0, .35);
      --scene: radial-gradient(circle at 12% 8%, rgba(104,232,213,.12), transparent 30rem), radial-gradient(circle at 92% 18%, rgba(123,140,255,.16), transparent 34rem), linear-gradient(160deg,#07101e 0%,#091426 48%,#060c16 100%);
      --grid-opacity: .18;
    }
    html[data-style="aurora"] { --bg:#071610; --panel:rgba(10,35,31,.76); --panel-strong:#102d29; --line:rgba(166,255,220,.15); --accent:#79f2b8; --accent-2:#a877ff; --scene:radial-gradient(ellipse at 18% 2%,rgba(83,255,187,.24),transparent 38rem),radial-gradient(ellipse at 83% 10%,rgba(168,119,255,.24),transparent 38rem),linear-gradient(155deg,#061510,#0b1d22 52%,#100c20); }
    html[data-style="neon"] { --bg:#10091c; --panel:rgba(25,12,42,.78); --panel-strong:#25133c; --line:rgba(255,125,224,.17); --accent:#48f4ff; --accent-2:#ff58ca; --scene:linear-gradient(115deg,transparent 45%,rgba(255,55,196,.08) 45.5%,transparent 46%),radial-gradient(circle at 82% 16%,rgba(255,44,191,.28),transparent 28rem),radial-gradient(circle at 12% 72%,rgba(29,218,255,.2),transparent 34rem),linear-gradient(155deg,#080611,#170a26 48%,#070e1c); }
    html[data-style="ember"] { --bg:#1a0e0b; --panel:rgba(45,23,19,.76); --panel-strong:#382019; --line:rgba(255,192,126,.16); --accent:#ffcb72; --accent-2:#ff7468; --scene:radial-gradient(circle at 14% 8%,rgba(255,181,79,.22),transparent 31rem),radial-gradient(circle at 90% 34%,rgba(255,79,94,.18),transparent 36rem),linear-gradient(150deg,#190d09,#25120f 48%,#0c0a11); }
    html[data-style="ocean"] { --bg:#04131b; --panel:rgba(6,34,48,.76); --panel-strong:#0b2a3a; --line:rgba(114,220,255,.16); --accent:#56e6ff; --accent-2:#4c8fff; --scene:radial-gradient(ellipse at 50% -8%,rgba(61,211,255,.23),transparent 38rem),radial-gradient(circle at 6% 75%,rgba(37,113,255,.18),transparent 32rem),linear-gradient(175deg,#041721,#07121e 54%,#030a12); }
    html[data-style="mono"] { --bg:#0c0e12; --panel:rgba(28,30,36,.78); --panel-strong:#24272e; --line:rgba(255,255,255,.12); --accent:#e8edf5; --accent-2:#8994a6; --scene:radial-gradient(circle at 50% 0,rgba(255,255,255,.1),transparent 33rem),linear-gradient(145deg,#0d0f13,#16191f 48%,#08090c); --grid-opacity:.1; }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--scene);
      transition: background .45s ease;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: var(--grid-opacity);
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { width: min(1380px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 42px; position: relative; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .02em; }
    .brand-mark { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 30px rgba(104,232,213,.2); color: #06111d; }
    .privacy { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .privacy::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
    .header-actions { display:flex; align-items:center; gap:12px; }
    .style-control { position:relative; z-index:12; }
    .style-toggle { height:38px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.05); color:#dce6f5; cursor:pointer; }
    .style-toggle:hover { background:rgba(255,255,255,.09); }
    .style-orb { width:17px; height:17px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 0 13px color-mix(in srgb,var(--accent) 55%,transparent); }
    .style-picker { position:absolute; right:0; top:48px; width:330px; padding:14px; border:1px solid var(--line); border-radius:18px; background:rgba(8,17,31,.96); box-shadow:0 24px 70px rgba(0,0,0,.55); backdrop-filter:blur(24px); }
    .style-picker[hidden] { display:none; }
    .style-picker-head { display:flex; justify-content:space-between; align-items:center; margin:0 2px 11px; }
    .style-picker-head strong { font-size:13px; }
    .style-picker-head span { color:var(--muted); font-size:10px; }
    .style-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .style-option { display:grid; grid-template-columns:42px 1fr; align-items:center; gap:9px; min-width:0; padding:7px; border:1px solid transparent; border-radius:12px; background:rgba(255,255,255,.035); color:#dce6f5; cursor:pointer; text-align:left; }
    .style-option:hover { background:rgba(255,255,255,.075); }
    .style-option.active { border-color:var(--accent); background:rgba(255,255,255,.08); }
    .style-preview { width:42px; height:34px; border-radius:9px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
    .style-preview.deep { background:radial-gradient(circle at 20% 20%,#3ddbc4,transparent 42%),linear-gradient(135deg,#07101e,#26366d); }
    .style-preview.aurora { background:radial-gradient(circle at 20% 10%,#68f0aa,transparent 45%),linear-gradient(135deg,#071610,#6e45a7); }
    .style-preview.neon { background:radial-gradient(circle at 80% 20%,#ff43c5,transparent 45%),linear-gradient(135deg,#0c0714,#076b82); }
    .style-preview.ember { background:radial-gradient(circle at 18% 15%,#ffc35e,transparent 45%),linear-gradient(135deg,#180c09,#9a2938); }
    .style-preview.ocean { background:radial-gradient(circle at 50% 0,#45daf2,transparent 45%),linear-gradient(150deg,#03131c,#173a86); }
    .style-preview.mono { background:radial-gradient(circle at 50% 0,#8b9099,transparent 45%),linear-gradient(145deg,#08090b,#31353d); }
    .style-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:11px; font-weight:750; }
    .hero { max-width: 760px; margin: 42px auto 34px; text-align: center; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(36px, 6vw, 66px); line-height: 1.02; letter-spacing: -.055em; }
    .hero p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: 230px minmax(300px, .78fr) minmax(430px, 1.1fr); gap: 18px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
    .setup { padding: 24px; }
    .presets { padding: 16px; position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
    .presets-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 4px 14px; }
    .presets-head h2 { margin: 0; font-size: 16px; }
    .presets-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .new-preset { width: 36px; height: 36px; flex: none; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.055); color: var(--accent); cursor: pointer; font-size: 20px; }
    .preset-list { min-width: 0; max-width: 100%; display: grid; gap: 8px; overflow: auto; padding-right: 2px; }
    .preset-card { display: grid; grid-template-columns: 1fr 30px; align-items: center; gap: 3px; border: 1px solid transparent; border-radius: 14px; background: rgba(255,255,255,.035); transition: .18s; }
    .preset-card:hover { background: rgba(255,255,255,.06); }
    .preset-card.active { border-color: rgba(104,232,213,.42); background: linear-gradient(120deg,rgba(104,232,213,.12),rgba(123,140,255,.08)); }
    .preset-main { min-width: 0; padding: 12px 4px 12px 12px; text-align: left; border: 0; background: transparent; color: inherit; cursor: pointer; }
    .preset-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 800; }
    .preset-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .delete-preset { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #667b97; cursor: pointer; font-size: 16px; }
    .delete-preset:hover { color: var(--danger); background: rgba(255,118,146,.1); }
    .preset-empty { padding: 22px 10px; border: 1px dashed var(--line); border-radius: 13px; color: var(--muted); font-size: 12px; line-height: 1.7; text-align: center; }
    .save-preset { width: 100%; min-height: 46px; margin-top: 16px; border: 1px solid rgba(104,232,213,.32); border-radius: 13px; background: rgba(104,232,213,.09); color: var(--accent); font-weight: 800; cursor: pointer; }
    .save-preset.saved { color: #b8c7d9; border-color: var(--line); background: rgba(255,255,255,.035); }
    .panel-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    .panel-head h2 { font-size: 18px; margin: 0 0 5px; }
    .panel-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .count { min-width: 40px; height: 26px; border-radius: 999px; display: grid; place-items: center; background: rgba(104,232,213,.1); color: var(--accent); font-weight: 800; font-size: 12px; }
    label.field-label { display: block; margin: 0 0 8px; color: #c8d4e7; font-size: 13px; font-weight: 700; }
    .text-input, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; background: rgba(4, 12, 24, .65); color: var(--text); outline: none; transition: .2s; resize: vertical;
    }
    .text-input { height: 48px; padding: 0 14px; }
    textarea { min-height: 96px; padding: 13px 14px; line-height: 1.6; }
    .text-input:focus, textarea:focus { border-color: rgba(104,232,213,.65); box-shadow: 0 0 0 4px rgba(104,232,213,.08); }
    .field { margin-bottom: 20px; }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .icon-btn, .secondary, .primary, .ghost { border: 0; cursor: pointer; transition: transform .18s, background .18s, opacity .18s, border-color .18s; }
    .icon-btn:hover, .secondary:hover, .primary:hover, .ghost:hover { transform: translateY(-1px); }
    .icon-btn { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #04151a; font-size: 24px; font-weight: 500; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
    .options { display: grid; gap: 8px; max-height: 278px; overflow: auto; padding-right: 3px; }
    .option { display: grid; grid-template-columns: 28px 1fr 34px; gap: 8px; align-items: center; min-height: 46px; padding: 6px 6px 6px 10px; border: 1px solid transparent; border-radius: 13px; background: rgba(255,255,255,.035); }
    .option.used { opacity: .42; }
    .dot { width: 10px; height: 10px; border-radius: 50%; justify-self: center; box-shadow: 0 0 12px currentColor; }
    .option input { width: 100%; color: var(--text); background: transparent; border: 0; outline: 0; min-width: 0; }
    .remove { width: 32px; height: 32px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; }
    .remove:hover { color: var(--danger); background: rgba(255,118,146,.1); }
    .empty { padding: 24px 14px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; font-size: 13px; }
    .settings { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .switch-label { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 13px; color: #cbd7e8; }
    .switch-label input { position: absolute; opacity: 0; }
    .switch { width: 42px; height: 24px; border-radius: 999px; padding: 3px; background: #263750; transition: .2s; }
    .switch::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: white; transition: .2s; }
    .switch-label input:checked + .switch { background: var(--accent); }
    .switch-label input:checked + .switch::after { transform: translateX(18px); background: #07131c; }
    .ghost { padding: 8px 10px; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; }
    .ghost:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .wheel-panel { padding: 24px; min-height: 620px; display: grid; place-items: center; position: sticky; top: 20px; overflow: hidden; }
    .topic { position: absolute; top: 24px; left: 24px; right: 24px; text-align: center; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topic strong { color: var(--text); font-weight: 700; }
    .wheel-wrap { width: min(500px, 100%); aspect-ratio: 1; position: relative; margin-top: 42px; filter: drop-shadow(0 28px 38px rgba(0,0,0,.4)); cursor: grab; touch-action: none; user-select: none; }
    .wheel-wrap.dragging { cursor: grabbing; filter: drop-shadow(0 34px 44px rgba(0,0,0,.5)); }
    .wheel-wrap.disabled { cursor: not-allowed; opacity: .58; }
    canvas { width: 100%; height: 100%; display: block; }
    .pointer { --pointer-angle: 0deg; position: absolute; z-index: 4; left: 50%; top: calc(4% - 68px); transform: translateX(-50%) rotate(var(--pointer-angle)); transform-origin: 50% 10px; width: 46px; height: 68px; filter: drop-shadow(0 8px 9px rgba(0,0,0,.55)); will-change: transform; pointer-events: none; }
    .pointer::before { content: ""; position: absolute; left: 8px; right: 8px; top: 11px; bottom: 0; background: linear-gradient(90deg, #a9bbc9, #ffffff 45%, #b8c9d4); clip-path: polygon(50% 100%, 4% 8%, 96% 8%); border-radius: 9px; }
    .pointer::after { content: ""; position: absolute; left: 50%; top: 0; width: 20px; height: 20px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 36% 32%, #fff, #8ea5b6 42%, #33485c 72%); border: 3px solid #dcebf2; box-shadow: 0 2px 0 #263b50, 0 0 0 4px rgba(7,17,30,.7); }
    .hub { position: absolute; z-index: 2; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: 112px; height: 112px; border-radius: 50%; border: 8px solid rgba(4,13,24,.84); background: radial-gradient(circle at 38% 32%, #faffff, #9bdad2 52%, #43736f 100%); color: #071522; box-shadow: 0 12px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.8); display: grid; place-items: center; text-align: center; font-weight: 900; letter-spacing: .1em; pointer-events: none; }
    .hub small { display: block; margin-top: 3px; font-size: 9px; letter-spacing: .04em; color: #3f5b61; }
    body.spinning .setup { pointer-events: none; opacity: .68; }
    .wheel-help { position: absolute; bottom: 23px; color: var(--muted); font-size: 12px; }
    .history-panel { margin-top: 20px; padding: 20px 24px; }
    .history-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .history-head h2 { margin: 0; font-size: 16px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .history-item { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 999px; background: rgba(255,255,255,.045); color: #d6e1ef; font-size: 12px; }
    .history-item time { color: var(--muted); }
    .result-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(1,6,13,.72); backdrop-filter: blur(16px); opacity: 0; visibility: hidden; transition: .25s; }
    .result-backdrop.show { opacity: 1; visibility: visible; }
    .result-card { width: min(460px, 100%); padding: 34px; border: 1px solid rgba(104,232,213,.26); border-radius: 28px; text-align: center; background: linear-gradient(160deg, #142842, #0a1728); box-shadow: 0 30px 90px rgba(0,0,0,.6); transform: translateY(16px) scale(.96); transition: .3s; }
    .show .result-card { transform: none; }
    .result-icon { width: 58px; height: 58px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px; background: rgba(104,232,213,.12); color: var(--accent); font-size: 28px; }
    .result-card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .result-card h2 { margin: 0; font-size: clamp(28px, 7vw, 44px); line-height: 1.2; overflow-wrap: anywhere; }
    .result-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; margin-top: 28px; }
    .secondary, .primary { min-height: 48px; border-radius: 14px; font-weight: 800; }
    .secondary { background: rgba(255,255,255,.07); border: 1px solid var(--line); }
    .primary { background: linear-gradient(135deg, var(--accent), #8cf0ba); color: #06151a; }
    .toast { position: fixed; z-index: 30; left: 50%; bottom: 28px; transform: translate(-50%, 16px); padding: 11px 16px; border-radius: 12px; background: #eefdfb; color: #0a1b26; font-size: 13px; font-weight: 700; box-shadow: 0 15px 40px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .confetti { position: fixed; z-index: 25; width: 8px; height: 13px; border-radius: 2px; pointer-events: none; animation: fall 1.8s ease-in forwards; }
    @keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(720deg); opacity: .2; } }
    @media (max-width: 1120px) {
      .app { width: min(100% - 24px, 900px); }
      .grid { grid-template-columns: minmax(300px,.85fr) minmax(430px,1.15fr); }
      .presets { grid-column: 1 / -1; position: static; max-height: none; }
      .preset-list { display: flex; overflow-x: auto; padding-bottom: 2px; }
      .preset-card { min-width: 190px; max-width: 240px; }
      .preset-empty { width: 100%; }
    }
    @media (max-width: 860px) {
      .app { width: min(100% - 20px, 640px); padding-top: 18px; }
      header { margin-bottom: 10px; }
      .hero { margin: 30px auto 24px; }
      .grid { grid-template-columns: 1fr; }
      .presets { grid-column: auto; }
      .wheel-panel { min-height: auto; padding: 54px 18px 52px; position: relative; top: auto; }
      .wheel-wrap { max-width: 480px; }
    }
    @media (max-width: 480px) {
      .privacy span { display: none; }
      .style-toggle > span:last-child { display:none; }
      .style-toggle { width:38px; padding:0; justify-content:center; }
      .style-picker { position:fixed; top:72px; left:10px; right:10px; width:auto; }
      .hero p { font-size: 14px; }
      .setup { padding: 18px; }
      .wheel-panel { padding-inline: 8px; }
      .hub { width: 88px; height: 88px; border-width: 6px; font-size: 12px; }
      .result-actions { grid-template-columns: 1fr; }
      .settings { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span><span>選擇困難抑制器</span></div>
      <div class="header-actions">
        <div class="privacy"><span>本機運作・自動保存</span></div>
        <div class="style-control">
          <button class="style-toggle" id="styleToggle" type="button" aria-label="背景風格" aria-expanded="false" aria-controls="stylePicker"><span class="style-orb" aria-hidden="true"></span><span>背景風格</span></button>
          <div class="style-picker" id="stylePicker" hidden>
            <div class="style-picker-head"><strong>選擇背景風格</strong><span>自動保存</span></div>
            <div class="style-grid">
              <button class="style-option" data-style="deep" type="button"><span class="style-preview deep"></span><span class="style-name">深海科技</span></button>
              <button class="style-option" data-style="aurora" type="button"><span class="style-preview aurora"></span><span class="style-name">極光幻境</span></button>
              <button class="style-option" data-style="neon" type="button"><span class="style-preview neon"></span><span class="style-name">霓虹夜城</span></button>
              <button class="style-option" data-style="ember" type="button"><span class="style-preview ember"></span><span class="style-name">餘燼夕陽</span></button>
              <button class="style-option" data-style="ocean" type="button"><span class="style-preview ocean"></span><span class="style-name">深藍海域</span></button>
              <button class="style-option" data-style="mono" type="button"><span class="style-preview mono"></span><span class="style-name">極簡黑白</span></button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">DECISION, SIMPLIFIED</div>
      <h1>別再想了，轉吧。</h1>
      <p>把候選項交給機率。你只需要決定，要不要接受答案。</p>
    </section>

    <section class="grid">
      <aside class="panel presets" aria-label="我的題組">
        <div class="presets-head">
          <div><h2>我的題組</h2><p>儲存在這台裝置</p></div>
          <button class="new-preset" id="newPreset" type="button" aria-label="建立新題組">＋</button>
        </div>
        <div class="preset-list" id="presetList"></div>
      </aside>

      <div class="panel setup">
        <div class="panel-head">
          <div><h2>設定這次的選擇</h2><p>至少加入兩個不同選項</p></div>
          <span class="count" id="optionCount">0</span>
        </div>

        <div class="field">
          <label class="field-label" for="topicInput">你正在決定什麼？</label>
          <input class="text-input" id="topicInput" maxlength="80" placeholder="例如：今天晚餐吃什麼？" autocomplete="off">
        </div>

        <div class="field">
          <label class="field-label" for="optionInput">加入選項</label>
          <div class="add-row">
            <input class="text-input" id="optionInput" maxlength="60" placeholder="輸入後按 Enter" autocomplete="off">
            <button class="icon-btn" id="addButton" type="button" aria-label="加入選項">＋</button>
          </div>
          <p class="hint">可貼上多行文字，一行會成為一個選項</p>
        </div>

        <div class="options" id="optionList" aria-live="polite"></div>

        <button class="save-preset" id="savePreset" type="button">加入我的題組</button>

        <div class="settings">
          <label class="switch-label">
            <input id="noRepeat" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span>本輪不重複抽中</span>
          </label>
          <button class="ghost" id="resetUsed" type="button" hidden>恢復全部</button>
          <button class="ghost" id="clearAll" type="button">清空</button>
        </div>
      </div>

      <div class="panel wheel-panel">
        <div class="topic" id="topicDisplay">等待你的選擇題</div>
        <div class="wheel-wrap disabled" id="wheelWrap" role="application" tabindex="0" aria-label="拖曳選項輪盤後放開以轉動">
          <div class="pointer" id="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="選項輪盤"></canvas>
          <div class="hub" aria-hidden="true">抓住甩動<small>DRAG & RELEASE</small></div>
        </div>
        <div class="wheel-help" id="wheelHelp">加入至少 2 個選項即可開始</div>
      </div>
    </section>

    <section class="panel history-panel" id="historyPanel" hidden>
      <div class="history-head"><h2>最近結果</h2><button class="ghost" id="clearHistory" type="button">清除紀錄</button></div>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <div class="result-backdrop" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <div class="result-icon" aria-hidden="true">✦</div>
      <p id="resultTopic">命運替你選了</p>
      <h2 id="resultTitle"></h2>
      <div class="result-actions">
        <button class="secondary" id="closeResult" type="button">接受結果</button>
        <button class="primary" id="spinAgain" type="button">不接受，再甩一次</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      'use strict';
      const COLORS = ['#68e8d5','#7b8cff','#ff88b7','#ffbd69','#69b8ff','#9fe870','#cf8cff','#ff7d72','#48d7ff','#ffd85c'];
      const DEFAULTS = ['第一個選項', '第二個選項', '第三個選項'];
      const STYLES = ['deep','aurora','neon','ember','ocean','mono'];
      const PEG_COUNT = 40;
      const PEG_STEP = Math.PI * 2 / PEG_COUNT;
      const $ = id => document.getElementById(id);
      const els = {
        topic: $('topicInput'), option: $('optionInput'), add: $('addButton'), list: $('optionList'), count: $('optionCount'),
        noRepeat: $('noRepeat'), resetUsed: $('resetUsed'), clearAll: $('clearAll'), canvas: $('wheel'), wheelWrap: $('wheelWrap'), pointer: $('pointer'),
        help: $('wheelHelp'), topicDisplay: $('topicDisplay'), modal: $('resultModal'), resultTitle: $('resultTitle'),
        resultTopic: $('resultTopic'), closeResult: $('closeResult'), spinAgain: $('spinAgain'), toast: $('toast'),
        historyPanel: $('historyPanel'), historyList: $('historyList'), clearHistory: $('clearHistory'),
        presetList: $('presetList'), newPreset: $('newPreset'), savePreset: $('savePreset'),
        styleToggle: $('styleToggle'), stylePicker: $('stylePicker')
      };
      const ctx = els.canvas.getContext('2d');
      let state = load();
      let rotation = 0;
      let spinning = false;
      let animationId = 0;
      let toastTimer = 0;
      let dragging = false;
      let dragMoved = false;
      let lastDragAngle = 0;
      let lastDragTime = 0;
      let angularVelocity = 0;
      let releasePower = 0;
      let pointerDeflection = 0;
      let pointerSpringVelocity = 0;

      function uid() { return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`; }
      function fresh() { return { topic: '', options: DEFAULTS.map(text => ({ id: uid(), text, used: false })), noRepeat: false, history: [], presets: [], activePresetId: null, style: 'deep' }; }
      function load() {
        try {
          const value = JSON.parse(localStorage.getItem('choice-decider-v1'));
          if (value && Array.isArray(value.options)) return {
            topic: value.topic || '', options: value.options, noRepeat: !!value.noRepeat,
            history: Array.isArray(value.history) ? value.history.slice(0, 12) : [],
            presets: Array.isArray(value.presets) ? value.presets : [],
            activePresetId: value.activePresetId || null,
            style: STYLES.includes(value.style) ? value.style : 'deep'
          };
        } catch (_) {}
        return fresh();
      }
      function syncActivePreset() {
        if (!state.activePresetId) return;
        const preset = state.presets.find(item => item.id === state.activePresetId);
        if (!preset) { state.activePresetId = null; return; }
        preset.topic = state.topic.replace(/\s+/g,' ').trim().slice(0,80);
        preset.options = state.options.map(option => cleanText(option.text)).filter(Boolean);
        preset.updatedAt = Date.now();
      }
      function save() { syncActivePreset(); localStorage.setItem('choice-decider-v1', JSON.stringify(state)); renderPresets(); }
      function cleanText(value) { return value.replace(/\s+/g, ' ').trim().slice(0, 60); }
      function activeOptions() { return state.options.filter(o => o.text.trim() && (!state.noRepeat || !o.used)); }
      function distinctCount(options = activeOptions()) { return new Set(options.map(o => o.text.trim().toLocaleLowerCase())).size; }
      function applyStyle(name, persist = false) {
        const next = STYLES.includes(name) ? name : 'deep';
        state.style = next; document.documentElement.dataset.style = next;
        document.querySelectorAll('.style-option').forEach(button => button.classList.toggle('active', button.dataset.style === next));
        if (persist) { save(); showToast(`已套用「${buttonStyleName(next)}」`); }
      }
      function buttonStyleName(name) {
        return ({deep:'深海科技',aurora:'極光幻境',neon:'霓虹夜城',ember:'餘燼夕陽',ocean:'深藍海域',mono:'極簡黑白'})[name];
      }
      function closeStylePicker() { els.stylePicker.hidden = true; els.styleToggle.setAttribute('aria-expanded','false'); }

      function render() {
        els.topic.value = state.topic;
        els.noRepeat.checked = state.noRepeat;
        els.count.textContent = state.options.length;
        els.topicDisplay.innerHTML = state.topic ? `正在決定：<strong>${escapeHtml(state.topic)}</strong>` : '等待你的選擇題';
        els.list.innerHTML = '';
        if (!state.options.length) {
          els.list.innerHTML = '<div class="empty">還沒有選項，先把腦中的候選答案放進來。</div>';
        } else {
          state.options.forEach((option, index) => {
            const row = document.createElement('div');
            row.className = `option${option.used ? ' used' : ''}`;
            row.innerHTML = `<span class="dot" style="color:${COLORS[index % COLORS.length]};background:currentColor"></span><input aria-label="選項 ${index + 1}" maxlength="60"><button class="remove" type="button" aria-label="刪除 ${escapeHtml(option.text)}">×</button>`;
            const input = row.querySelector('input');
            input.value = option.text;
            input.addEventListener('input', e => { option.text = e.target.value; save(); draw(); updateAvailability(); });
            input.addEventListener('blur', e => { option.text = cleanText(e.target.value); render(); save(); });
            row.querySelector('.remove').addEventListener('click', () => removeOption(option.id));
            els.list.appendChild(row);
          });
        }
        const usedCount = state.options.filter(o => o.used).length;
        els.resetUsed.hidden = !state.noRepeat || usedCount === 0;
        els.clearAll.hidden = state.options.length === 0;
        els.savePreset.textContent = state.activePresetId ? '已加入題組・變更自動儲存' : '加入我的題組';
        els.savePreset.classList.toggle('saved', !!state.activePresetId);
        renderPresets();
        renderHistory();
        updateAvailability();
        draw();
      }

      function addOptions(raw) {
        const values = raw.split(/\r?\n/).map(cleanText).filter(Boolean);
        if (!values.length) return;
        const existing = new Set(state.options.map(o => o.text.toLocaleLowerCase()));
        let added = 0;
        for (const text of values) {
          if (!existing.has(text.toLocaleLowerCase())) {
            state.options.push({ id: uid(), text, used: false });
            existing.add(text.toLocaleLowerCase());
            added++;
          }
        }
        els.option.value = '';
        if (!added) showToast('相同的選項已經存在');
        else if (values.length > 1) showToast(`已加入 ${added} 個選項`);
        save(); render();
      }
      function removeOption(id) { state.options = state.options.filter(o => o.id !== id); save(); render(); }
      function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

      function renderPresets() {
        if (!els.presetList) return;
        if (!state.presets.length) {
          els.presetList.innerHTML = '<div class="preset-empty">完成問題與選項後，按下「加入我的題組」即可保存在這裡。</div>';
          return;
        }
        els.presetList.innerHTML = '';
        state.presets.forEach(preset => {
          const card = document.createElement('div');
          card.className = `preset-card${preset.id === state.activePresetId ? ' active' : ''}`;
          card.innerHTML = `<button class="preset-main" type="button"><span class="preset-name">${escapeHtml(preset.topic || '未命名題組')}</span><span class="preset-meta">${preset.options.length} 個選項</span></button><button class="delete-preset" type="button" aria-label="刪除 ${escapeHtml(preset.topic || '未命名題組')}">×</button>`;
          card.querySelector('.preset-main').addEventListener('click', () => selectPreset(preset.id));
          card.querySelector('.delete-preset').addEventListener('click', () => deletePreset(preset.id));
          els.presetList.appendChild(card);
        });
      }
      function saveCurrentPreset() {
        if (state.activePresetId) { save(); showToast('這組題目已是自動儲存狀態'); return; }
        const topic = state.topic.replace(/\s+/g,' ').trim();
        const options = state.options.map(option => cleanText(option.text)).filter(Boolean);
        if (!topic) { showToast('請先輸入要決定的問題'); els.topic.focus(); return; }
        if (distinctCount(state.options.filter(o=>o.text.trim())) < 2) { showToast('請先加入至少 2 個不同選項'); els.option.focus(); return; }
        const preset = { id: uid(), topic, options, updatedAt: Date.now() };
        state.presets.unshift(preset); state.activePresetId = preset.id;
        save(); render(); showToast('已加入我的題組，後續變更會自動儲存');
      }
      function selectPreset(id) {
        if (spinning || id === state.activePresetId) return;
        const preset = state.presets.find(item => item.id === id);
        if (!preset) return;
        state.activePresetId = id; state.topic = preset.topic;
        state.options = preset.options.map(text => ({id:uid(),text,used:false}));
        rotation = 0; save(); render(); showToast(`已切換至「${preset.topic}」`);
      }
      function newPreset() {
        if (spinning) return;
        const starter = !state.topic.trim() && state.options.map(o=>o.text).join('|') === DEFAULTS.join('|');
        const unsaved = !state.activePresetId && !starter && (state.topic.trim() || state.options.some(o=>o.text.trim()));
        if (unsaved && !confirm('目前內容尚未加入「我的題組」，仍要建立新題組嗎？')) return;
        state.activePresetId = null; state.topic = ''; state.options = []; rotation = 0;
        save(); render(); els.topic.focus();
      }
      function deletePreset(id) {
        const preset = state.presets.find(item => item.id === id);
        if (!preset || !confirm(`要從「我的題組」刪除「${preset.topic}」嗎？`)) return;
        state.presets = state.presets.filter(item => item.id !== id);
        if (state.activePresetId === id) state.activePresetId = null;
        save(); render(); showToast('題組已刪除，目前編輯內容仍保留');
      }

      function updateAvailability() {
        const active = activeOptions();
        const hasValidPool = state.noRepeat
          ? distinctCount(state.options.filter(o => o.text.trim())) >= 2 && active.length >= 1
          : distinctCount(active) >= 2;
        els.wheelWrap.classList.toggle('disabled', !hasValidPool || spinning);
        els.wheelWrap.setAttribute('aria-disabled', String(!hasValidPool || spinning));
        if (spinning) els.help.textContent = '指針正在與最後幾根隔針拉扯…';
        else if (state.noRepeat && active.length === 0 && state.options.length >= 2) els.help.textContent = '本輪已抽完，點「恢復全部」重新開始';
        else if ((!state.noRepeat && distinctCount(active) < 2) || (state.noRepeat && distinctCount(state.options.filter(o=>o.text.trim())) < 2)) els.help.textContent = '加入至少 2 個不同選項即可開始';
        else els.help.textContent = `${active.length} 個候選項・抓住輪盤快速甩動後放開`;
      }

      function draw() {
        const options = activeOptions();
        const { width: w, height: h } = els.canvas;
        const cx = w / 2, cy = h / 2, radius = w * .47;
        ctx.clearRect(0, 0, w, h);
        ctx.save(); ctx.translate(cx, cy);
        if (!options.length) {
          ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#14243a'; ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#7387a4'; ctx.font = '600 27px Microsoft JhengHei, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('等待選項', 0, -150);
          ctx.restore(); return;
        }
        const slice = Math.PI * 2 / options.length;
        options.forEach((option, i) => {
          const start = rotation + i * slice - Math.PI / 2;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,radius,start,start+slice); ctx.closePath();
          const grad = ctx.createRadialGradient(0,0,40,0,0,radius);
          grad.addColorStop(0, shade(COLORS[i % COLORS.length], -.16)); grad.addColorStop(1, COLORS[i % COLORS.length]);
          ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = 'rgba(5,15,27,.46)'; ctx.lineWidth = 5; ctx.stroke();
          ctx.save(); ctx.rotate(start + slice / 2); ctx.translate(radius * .64, 0); ctx.rotate(Math.PI / 2);
          const maxChars = options.length > 10 ? 8 : options.length > 6 ? 11 : 15;
          let text = option.text.length > maxChars ? option.text.slice(0, maxChars - 1) + '…' : option.text;
          ctx.fillStyle = '#071521'; ctx.font = `800 ${options.length > 10 ? 20 : options.length > 6 ? 24 : 29}px Microsoft JhengHei, sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 0, radius * .5);
          ctx.restore();
        });
        ctx.beginPath(); ctx.arc(0,0,radius,0,Math.PI*2); ctx.strokeStyle = 'rgba(225,255,251,.75)'; ctx.lineWidth = 7; ctx.stroke();
        for (let i=0; i<PEG_COUNT; i++) {
          const angle = rotation + i * PEG_STEP - Math.PI / 2;
          const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
          ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2);
          const peg = ctx.createRadialGradient(x-3,y-4,1,x,y,10);
          peg.addColorStop(0,'#ffffff'); peg.addColorStop(.38,'#d7e6ed'); peg.addColorStop(1,'#607789');
          ctx.fillStyle = peg; ctx.fill();
          ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(7,18,30,.8)'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }
      function shade(hex, amount) {
        const n = parseInt(hex.slice(1),16), clamp = v => Math.max(0,Math.min(255,v));
        const r = clamp((n>>16) + 255*amount), g = clamp(((n>>8)&255) + 255*amount), b = clamp((n&255) + 255*amount);
        return `rgb(${r},${g},${b})`;
      }
      function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
      function easeInOutCubic(t) { return t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
      function mod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
      function normalizeAngle(angle) { return mod(angle + Math.PI, Math.PI * 2) - Math.PI; }

      function hasValidPool() {
        const available = activeOptions();
        return state.noRepeat
          ? distinctCount(state.options.filter(o => o.text.trim())) >= 2 && available.length >= 1
          : distinctCount(available) >= 2;
      }
      function pointerAngle(event) {
        const rect = els.wheelWrap.getBoundingClientRect();
        return Math.atan2(event.clientY - (rect.top + rect.height/2), event.clientX - (rect.left + rect.width/2));
      }
      function setPointerAngle(degrees) { els.pointer.style.setProperty('--pointer-angle', `${Math.max(-34,Math.min(34,degrees))}deg`); }
      function updatePointerPhysics(direction, speed, dt = 16) {
        const phase = mod(rotation / PEG_STEP, 1);
        const force = Math.max(.32,Math.min(1,Math.abs(speed)/.014));
        let target = 0;
        if (direction > 0) {
          if (phase > .7) {
            const p=(phase-.7)/.3, smooth=p*p*(3-2*p);
            target=smooth*(13+16*force);
          }
        } else {
          if (direction < 0 && phase < .3) {
            const p=1-phase/.3, smooth=p*p*(3-2*p);
            target=-smooth*(13+16*force);
          }
        }
        const step=Math.max(.25,Math.min(2,dt/16));
        pointerSpringVelocity+=(target-pointerDeflection)*.25*step;
        pointerSpringVelocity*=Math.pow(.6,step);
        pointerDeflection+=pointerSpringVelocity*step;
        setPointerAngle(pointerDeflection);
      }
      function relaxPointer(done) {
        const started=performance.now(); let previous=started;
        function relax(now) {
          const dt=Math.min(32,now-previous); previous=now;
          updatePointerPhysics(0,0,dt);
          if (now-started<360 && (Math.abs(pointerDeflection)>.08 || Math.abs(pointerSpringVelocity)>.03)) animationId=requestAnimationFrame(relax);
          else { pointerDeflection=0; pointerSpringVelocity=0; setPointerAngle(0); done(); }
        }
        animationId=requestAnimationFrame(relax);
      }
      function beginDrag(event) {
        if (spinning || !hasValidPool()) {
          if (!spinning) showToast('請先加入至少 2 個不同選項');
          return;
        }
        closeModal();
        cancelAnimationFrame(animationId);
        dragging = true; dragMoved = false; angularVelocity = 0;
        lastDragAngle = pointerAngle(event); lastDragTime = performance.now();
        els.wheelWrap.classList.add('dragging');
        els.wheelWrap.setPointerCapture?.(event.pointerId);
      }
      function moveDrag(event) {
        if (!dragging) return;
        const now = performance.now();
        const angle = pointerAngle(event);
        const delta = Math.max(-.55, Math.min(.55, normalizeAngle(angle-lastDragAngle)));
        const dt = Math.max(8, now-lastDragTime);
        if (Math.abs(delta) > .002) dragMoved = true;
        rotation += delta;
        const instantVelocity = delta/dt;
        angularVelocity = angularVelocity*.58 + instantVelocity*.42;
        lastDragAngle = angle; lastDragTime = now;
        draw(); updatePointerPhysics(Math.sign(delta), instantVelocity, dt);
      }
      function endDrag(event) {
        if (!dragging) return;
        dragging = false; els.wheelWrap.classList.remove('dragging');
        try { els.wheelWrap.releasePointerCapture?.(event.pointerId); } catch (_) {}
        if (!dragMoved || Math.abs(angularVelocity) < .00045) {
          relaxPointer(()=>{}); showToast('再甩快一點，輪盤才會轉起來'); return;
        }
        startMomentum(angularVelocity);
      }
      function startMomentum(initialVelocity) {
        const options = activeOptions();
        let velocity = Math.max(-.055, Math.min(.055, initialVelocity*1.8));
        const direction = Math.sign(velocity) || 1;
        releasePower = Math.min(1, Math.abs(velocity)/.028);
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let previous = performance.now();
        spinning = true; document.body.classList.add('spinning'); updateAvailability();
        function coast(now) {
          const dt = Math.min(32, now-previous); previous = now;
          rotation += velocity*dt;
          velocity *= Math.pow(reduce ? .72 : .982, dt/16.67);
          draw(); updatePointerPhysics(direction, velocity, dt);
          if (Math.abs(velocity) > (reduce ? .003 : .00072)) animationId = requestAnimationFrame(coast);
          else settleAtPeg(options, direction);
        }
        animationId = requestAnimationFrame(coast);
      }
      function settleAtPeg(options, direction) {
        const optionSlice = Math.PI*2/options.length;
        const boundary = direction > 0
          ? Math.ceil((rotation+1e-7)/PEG_STEP)*PEG_STEP
          : Math.floor((rotation-1e-7)/PEG_STEP)*PEG_STEP;
        const startRotation = rotation;
        const nearBoundary = boundary-direction*PEG_STEP*.025;
        const willCross = releasePower*.72 + Math.random()*.52 > .61;
        const finalRotation = willCross
          ? boundary+direction*PEG_STEP*(.20+Math.random()*.07)
          : boundary-direction*PEG_STEP*(.18+Math.random()*.07);
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const duration = reduce ? 100 : 1180;
        const start = performance.now(); let previous=start;
        function suspense(now) {
          const dt=Math.min(32,now-previous); previous=now;
          const t = Math.min(1,(now-start)/duration);
          if (t < .56) {
            rotation = startRotation+(nearBoundary-startRotation)*easeOutQuart(t/.56);
          } else {
            const p=(t-.56)/.44;
            const spring=Math.exp(-5.4*p)*Math.cos(p*Math.PI*2.15);
            rotation=finalRotation+(nearBoundary-finalRotation)*spring;
          }
          draw(); updatePointerPhysics(direction, .0015, dt);
          if (t < 1) animationId = requestAnimationFrame(suspense);
          else {
            rotation=finalRotation; draw();
            const selectedIndex = Math.floor(mod(-rotation,Math.PI*2)/optionSlice) % options.length;
            relaxPointer(()=>finishSpin(options[selectedIndex]));
          }
        }
        animationId = requestAnimationFrame(suspense);
      }
      function finishSpin(selected) {
        spinning = false;
        document.body.classList.remove('spinning');
        if (state.noRepeat) {
          const original = state.options.find(o => o.id === selected.id);
          if (original) original.used = true;
        }
        state.history.unshift({ text: selected.text, topic: state.topic, time: Date.now() });
        state.history = state.history.slice(0, 12);
        save(); render();
        els.resultTitle.textContent = selected.text;
        els.resultTopic.textContent = state.topic || '命運替你選了';
        els.modal.classList.add('show');
        els.closeResult.focus();
        celebrate();
      }
      function closeModal() { els.modal.classList.remove('show'); }
      function renderHistory() {
        els.historyPanel.hidden = !state.history.length;
        els.historyList.innerHTML = state.history.map(item => `<div class="history-item"><span>${escapeHtml(item.text)}</span><time>${formatTime(item.time)}</time></div>`).join('');
      }
      function formatTime(timestamp) { return new Date(timestamp).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }); }
      function showToast(message) { clearTimeout(toastTimer); els.toast.textContent = message; els.toast.classList.add('show'); toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800); }
      function celebrate() {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        for (let i=0;i<30;i++) {
          const bit = document.createElement('i'); bit.className = 'confetti';
          bit.style.left = `${35 + Math.random()*30}%`; bit.style.top = `${8 + Math.random()*12}%`;
          bit.style.background = COLORS[i % COLORS.length]; bit.style.setProperty('--drift', `${(Math.random()-.5)*400}px`);
          bit.style.animationDelay = `${Math.random()*.35}s`; document.body.appendChild(bit); setTimeout(()=>bit.remove(),2300);
        }
      }

      els.add.addEventListener('click', () => addOptions(els.option.value));
      els.savePreset.addEventListener('click', saveCurrentPreset);
      els.newPreset.addEventListener('click', newPreset);
      els.styleToggle.addEventListener('click', event => {
        event.stopPropagation();
        els.stylePicker.hidden = !els.stylePicker.hidden;
        els.styleToggle.setAttribute('aria-expanded', String(!els.stylePicker.hidden));
      });
      document.querySelectorAll('.style-option').forEach(button => button.addEventListener('click', () => {
        applyStyle(button.dataset.style, true); closeStylePicker();
      }));
      els.option.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addOptions(els.option.value); } });
      els.option.addEventListener('paste', e => { const text = e.clipboardData.getData('text'); if (/\r?\n/.test(text)) { e.preventDefault(); addOptions(text); } });
      els.topic.addEventListener('input', e => { state.topic = e.target.value.slice(0,80); save(); els.topicDisplay.innerHTML = state.topic ? `正在決定：<strong>${escapeHtml(state.topic)}</strong>` : '等待你的選擇題'; });
      els.noRepeat.addEventListener('change', e => { state.noRepeat = e.target.checked; if (!state.noRepeat) state.options.forEach(o => o.used=false); save(); render(); });
      els.resetUsed.addEventListener('click', () => { state.options.forEach(o=>o.used=false); save(); render(); showToast('所有選項已恢復'); });
      els.clearAll.addEventListener('click', () => { if (!state.options.length || confirm('要清除所有選項嗎？')) { state.options=[]; save(); render(); els.option.focus(); } });
      els.clearHistory.addEventListener('click', () => { state.history=[]; save(); renderHistory(); });
      els.wheelWrap.addEventListener('pointerdown', beginDrag);
      els.wheelWrap.addEventListener('pointermove', moveDrag);
      els.wheelWrap.addEventListener('pointerup', endDrag);
      els.wheelWrap.addEventListener('pointercancel', endDrag);
      els.closeResult.addEventListener('click', closeModal);
      els.spinAgain.addEventListener('click', () => { closeModal(); setTimeout(() => els.wheelWrap.focus(), 120); });
      els.modal.addEventListener('click', e => { if (e.target === els.modal) closeModal(); });
      document.addEventListener('click', e => { if (!e.target.closest('.style-control')) closeStylePicker(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeModal(); closeStylePicker(); }
      });
      window.addEventListener('resize', draw);
      applyStyle(state.style);
      render();
    })();
  </script>
</body>
</html>
